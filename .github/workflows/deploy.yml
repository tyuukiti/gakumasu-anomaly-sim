# GitHub Pages に Web 版をデプロイする workflow
#
# 動作条件:
#   - リポジトリ Settings → Pages → Source を "GitHub Actions" に設定しておくこと
#   - main ブランチへの push、または手動実行で発火
#
# base パスは vite.config.ts 側で GITHUB_REPOSITORY から自動解決される
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時並行ビルドを抑制 (古いデプロイをキャンセル)
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # 注意: 初回のみ Settings → Pages → Source = "GitHub Actions" を手動設定する必要あり。
        # 一度有効化すれば以降の deploy は自動で動く。
        # (enablement: true は GITHUB_TOKEN に admin 権限が必要で標準では動かない)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
